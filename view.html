    <script>

    // ======================
    const SUPABASE_URL = 'https://enmiomqkkdlmodrjmfak.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVubWlvbXFra2RsbW9kcmptZmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MDA0OTEsImV4cCI6MjA4MDk3NjQ5MX0.HeiJGnnkUjutlZkMTopFK7AIRZzRLxBTXvWk96OcAxg';

    // ======================
    // VARIABLES GLOBALES
    // ======================
    let publicacionId = null;
    let publicacionActual = null;
    let usuarioActual = null;
    
    // ======================
    // DETECCIÓN DE DISPOSITIVO
    // ======================
    const esMovil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // ======================
    // FUNCIONES DE UTILIDAD
    // ======================
    function obtenerIniciales(nombre) {
        if (!nombre) return '??';
        const partes = nombre.split(' ');
        let iniciales = '';
        partes.forEach(parte => {
            if (parte.length > 0) {
                iniciales += parte[0].toUpperCase();
            }
        });
        return iniciales.substring(0, 2);
    }
    
    function obtenerColorAvatar(nombre) {
        const colores = [
            '#667eea', '#764ba2', '#f093fb', '#f5576c',
            '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
            '#fa709a', '#fee140', '#a8edea', '#fed6e3'
        ];
        let hash = 0;
        for (let i = 0; i < nombre.length; i++) {
            hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colores[Math.abs(hash) % colores.length];
    }
    
    function formatearUbicacion(ciudad, pais) {
        if (ciudad && pais) {
            return `${ciudad}, ${pais}`;
        } else if (ciudad) {
            return ciudad;
        } else if (pais) {
            return pais;
        }
        return 'No especificada';
    }
    
    function calcularEdad(fechaNacimiento) {
        if (!fechaNacimiento) return 'No especificada';
        const hoy = new Date();
        const nacimiento = new Date(fechaNacimiento);
        let edad = hoy.getFullYear() - nacimiento.getFullYear();
        const mes = hoy.getMonth() - nacimiento.getMonth();
        if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) {
            edad--;
        }
        return `${edad} años`;
    }
    
    function formatearFecha(fecha) {
        if (!fecha) return 'No especificada';
        return new Date(fecha).toLocaleDateString('es-ES', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    }
    
    function formatearFechaCompleta(fecha) {
        if (!fecha) return 'No especificada';
        return new Date(fecha).toLocaleDateString('es-ES', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
    
    function calcularTiempoEnPlataforma(createdAt) {
        if (!createdAt) return 'No disponible';
        
        const fechaCreacion = new Date(createdAt);
        const hoy = new Date();
        const diferencia = hoy - fechaCreacion;
        const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
        
        if (dias === 0) return 'Hoy';
        if (dias === 1) return 'Ayer';
        if (dias < 30) return `Hace ${dias} días`;
        if (dias < 365) {
            const meses = Math.floor(dias / 30);
            return `Hace ${meses} ${meses === 1 ? 'mes' : 'meses'}`;
        }
        
        const años = Math.floor(dias / 365);
        return `Hace ${años} ${años === 1 ? 'año' : 'años'}`;
    }
    
    // ======================
    // FUNCIÓN PARA OBTENER DATOS COMPLETOS DEL USUARIO
    // ======================
    async function obtenerDatosUsuarioCompletos(userId) {
        console.log('🔍 Obteniendo datos COMPLETOS del usuario ID:', userId);
        
        // PRIMERO: Intentar con la función RPC actualizada
        try {
            console.log('🔄 Intentando obtener datos con RPC get_public_user_data...');
            const { data: rpcData, error: rpcError } = await supabaseClient.rpc(
                'get_public_user_data',
                { user_uuid: userId }
            );
            
            if (!rpcError && rpcData && rpcData.length > 0) {
                console.log('✅ Datos completos obtenidos via RPC:', rpcData[0]);
                
                // Guardar en localStorage para uso futuro
                try {
                    localStorage.setItem(`user_complete_${userId}`, JSON.stringify(rpcData[0]));
                    localStorage.setItem(`user_${userId}`, JSON.stringify({
                        nombre: rpcData[0].nombre,
                        apellidos: rpcData[0].apellidos,
                        avatar_url: rpcData[0].avatar_url,
                        email: rpcData[0].email,
                        pais: rpcData[0].pais,
                        ciudad: rpcData[0].ciudad,
                        biografia: rpcData[0].biografia
                    }));
                } catch (e) {
                    console.log('⚠️ No se pudo guardar en localStorage');
                }
                
                return rpcData[0];
            } else if (rpcError) {
                console.log('⚠️ Función RPC no disponible:', rpcError.message);
            }
        } catch (rpcError) {
            console.log('⚠️ Error en RPC:', rpcError.message);
        }
        
        // SEGUNDO: Si RPC falla, verificar datos locales
        try {
            const storedKey = `user_complete_${userId}`;
            const storedData = localStorage.getItem(storedKey);
            if (storedData) {
                const parsed = JSON.parse(storedData);
                console.log('✅ Datos obtenidos de localStorage:', parsed);
                return parsed;
            }
        } catch (error) {
            console.log('⚠️ Error obteniendo de localStorage:', error.message);
        }
        
        // TERCERO: Intentar obtener datos básicos (fallback)
        try {
            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('nombre, apellidos, avatar_url, email, pais, ciudad, biografia, perfil_publico')
                .eq('id', userId)
                .maybeSingle();
            
            if (!error && data) {
                console.log('✅ Datos básicos obtenidos directamente:', data);
                return data;
            }
        } catch (error) {
            console.log('⚠️ Error en consulta directa:', error.message);
        }
        
        // CUARTO: Datos por defecto
        console.log('⚠️ Usando datos por defecto');
        return {
            nombre: `Usuario_${userId.substring(0, 8)}`,
            avatar_url: null,
            email: null,
            perfil_publico: false
        };
    }
    
    // ======================
    // FUNCIÓN ORIGINAL PARA OBTENER DATOS BÁSICOS DEL USUARIO
    // ======================
    async function obtenerDatosUsuario(userId) {
        console.log('🔍 Obteniendo datos básicos del usuario ID:', userId);
        
        try {
            const { data: rpcData, error: rpcError } = await supabaseClient.rpc(
                'get_public_user_data',
                { user_uuid: userId }
            );
            
            if (!rpcError && rpcData && rpcData.length > 0) {
                const datos = rpcData[0];
                return {
                    nombre: datos.nombre,
                    apellidos: datos.apellidos,
                    avatar_url: datos.avatar_url,
                    email: datos.email,
                    pais: datos.pais,
                    ciudad: datos.ciudad,
                    biografia: datos.biografia,
                    perfil_publico: datos.perfil_publico
                };
            }
        } catch (error) {
            console.log('⚠️ Error en RPC:', error.message);
        }
        
        // Fallback a datos locales
        try {
            const storedKey = `user_${userId}`;
            const storedData = localStorage.getItem(storedKey);
            if (storedData) return JSON.parse(storedData);
        } catch (error) {
            console.log('⚠️ Error obteniendo de localStorage:', error.message);
        }
        
        return {
            nombre: `Usuario_${userId.substring(0, 8)}`,
            avatar_url: null,
            email: null
        };
    }

    async function obtenerDatosParaCompartir() {
        if (!publicacionActual) return null;
        
        try {
            // Obtener datos del usuario para el mensaje
            const usuarioData = await obtenerDatosUsuario(publicacionActual.usuario_id);
            const nombreAutor = usuarioData.nombre ? 
                (usuarioData.apellidos ? `${usuarioData.nombre} ${usuarioData.apellidos}` : usuarioData.nombre) :
                'Usuario Messery';
            
            // Construir mensaje personalizado
            let mensaje = `¡Mira esta publicación que encontré en Messery!\n\n`;
            mensaje += `👤 Publicado por: ${nombreAutor}\n`;
            
            if (publicacionActual.contenido) {
                const contenidoCorto = publicacionActual.contenido.length > 100 
                    ? publicacionActual.contenido.substring(0, 100) + '...' 
                    : publicacionActual.contenido;
                mensaje += `📝 ${contenidoCorto}\n\n`;
            }
            
            mensaje += `🔗 Enlace: ${window.location.href}\n\n`;
            mensaje += `¡Me pareció increíble! 😃\n`;
            mensaje += `#Messery #Compartir`;
            
            // Obtener imagen si existe
            let imagenUrl = null;
            if (publicacionActual.url_media && publicacionActual.tipo === 'imagen') {
                imagenUrl = publicacionActual.url_media;
            }
            
            return {
                url: window.location.href,
                mensaje: mensaje,
                titulo: `Publicación de ${nombreAutor} en Messery`,
                imagenUrl: imagenUrl,
                autor: nombreAutor
            };
            
        } catch (error) {
            console.error('Error obteniendo datos para compartir:', error);
            return {
                url: window.location.href,
                mensaje: '¡Mira esta publicación increíble que encontré en Messery! ' + window.location.href + '\n\n¡Me pareció impresionante! 😃\n#Messery #Compartir',
                titulo: 'Publicación en Messery',
                imagenUrl: null,
                autor: 'Messery'
            };
        }
    }

    async function cargarPublicacion() {
        try {
            console.log('🔄 Cargando publicación ID:', publicacionId);
            console.log('📱 Dispositivo:', esMovil ? 'Móvil' : 'PC/Desktop');
            
            if (!publicacionId) {
                throw new Error('No se especificó ID de publicación');
            }
            
            const { data: publicacion, error } = await supabaseClient
                .from('publicaciones')
                .select('*')
                .eq('id', publicacionId)
                .single();
            
            if (error) {
                console.error('Error Supabase:', error);
                if (error.code === 'PGRST116') {
                    throw new Error('Publicación no encontrada');
                }
                throw new Error('Error al cargar la publicación: ' + error.message);
            }
            
            if (!publicacion) {
                throw new Error('Publicación no encontrada');
            }
            
            publicacionActual = publicacion;
            
            if (publicacion.visibilidad !== 'publico') {
                mostrarError('🔒 Esta publicación es privada y no está disponible para ver públicamente');
                return;
            }
            
            console.log('✅ Publicación cargada:', publicacion);
            
            usuarioActual = await obtenerDatosUsuario(publicacion.usuario_id);
            console.log('👤 Datos finales del usuario:', usuarioActual);
            
            mostrarPublicacion(publicacion, usuarioActual);
            
            setTimeout(() => {
                document.getElementById('loginPrompt').style.display = 'block';
            }, 1000);
            
        } catch (error) {
            console.error('❌ Error cargando publicación:', error);
            mostrarError(error.message || 'No se pudo cargar la publicación');
        }
    }
    
    function mostrarPublicacion(publicacion, usuarioData) {

        loading.style.display = 'none';

            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        let nombreAutor = 'Usuario Messery';
        let avatarUrl = null;
        
        if (usuarioData) {
            if (usuarioData.nombre) {
                nombreAutor = usuarioData.apellidos 
                    ? `${usuarioData.nombre} ${usuarioData.apellidos}`
                    : usuarioData.nombre;
            } else if (usuarioData.email) {
                const nombreEmail = usuarioData.email.split('@')[0];
                nombreAutor = nombreEmail.charAt(0).toUpperCase() + nombreEmail.slice(1);
            } else {
                nombreAutor = `Usuario_${publicacion.usuario_id.substring(0, 8)}`;
            }
            
            avatarUrl = usuarioData.avatar_url;
        }
        
        let mediaHTML = '';
        if (publicacion.url_media) {
            switch(publicacion.tipo) {
                case 'imagen':
                    mediaHTML = `
                        <div class="publicacion-media">
                            <img src="${publicacion.url_media}" 
                                 alt="Imagen publicada" 
                                 loading="lazy"
                                 onclick="abrirImagenEnGrande('${publicacion.url_media}')"
                                 style="cursor: pointer; max-height: 500px; object-fit: contain;"
                                 onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='<p style=\\'color:#e74c3c; padding:20px; text-align:center;\\'><i class=\\'fas fa-exclamation-triangle\\'></i> No se pudo cargar la imagen</p>';">
                        </div>
                    `;
                    break;
                    
                case 'video':
                    if (publicacion.url_media.includes('youtube.com') || publicacion.url_media.includes('youtu.be')) {
                        const videoId = extraerIdYouTube(publicacion.url_media);
                        if (videoId) {
                            mediaHTML = `
                                <div class="publicacion-media">
                                    <iframe 
                                        width="100%" 
                                        height="400" 
                                        src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1" 
                                        frameborder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen
                                        loading="lazy">
                                    </iframe>
                                </div>
                            `;
                        }
                    } else {
                        mediaHTML = `
                            <div class="publicacion-media">
                                <video width="100%" controls style="border-radius: 10px;">
                                    <source src="${publicacion.url_media}" type="video/mp4">
                                    Tu navegador no soporta el video.
                                </video>
                            </div>
                        `;
                    }
                    break;
                    
                case 'enlace':
                    let dominio = 'Enlace compartido';
                    try {
                        const urlObj = new URL(publicacion.url_media);
                        dominio = urlObj.hostname.replace('www.', '');
                    } catch (e) {
                        console.warn('URL inválida:', publicacion.url_media);
                    }
                    
                    mediaHTML = `
                        <a href="${publicacion.url_media}" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="publicacion-enlace">
                            <i class="fas fa-external-link-alt"></i>
                            <div>
                                <strong>Enlace compartido</strong><br>
                                <small>${dominio}</small>
                            </div>
                        </a>
                    `;
                    break;
            }
        }
        
        let avatarHTML = '';

        if (avatarUrl) {
            avatarHTML = `
                <div class="publicacion-avatar" onclick="mostrarPerfilCompleto('${publicacion.usuario_id}')" style="position: relative; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #667eea; cursor: pointer;">
                    <img src="${avatarUrl}" 
                         alt="Avatar de ${nombreAutor}"
                         style="width: 100%; height: 100%; object-fit: cover;"
                         onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-user-circle\\' style=\\'font-size: 32px; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);\\'></i>';">
                </div>
            `;
        } else {
            avatarHTML = `
                <div class="publicacion-avatar" onclick="mostrarPerfilCompleto('${publicacion.usuario_id}')" style="display: flex; align-items: center; justify-content: center; background: ${obtenerColorAvatar(nombreAutor)}; cursor: pointer;">
                    <div style="color: white; font-size: 20px; font-weight: bold;">
                        ${obtenerIniciales(nombreAutor)}
                    </div>
                </div>
            `;
        }
        
        let userInfoHTML = '';
        if (usuarioData && (usuarioData.pais || usuarioData.ciudad)) {
            const ubicacion = [];
            if (usuarioData.ciudad) ubicacion.push(usuarioData.ciudad);
            if (usuarioData.pais) ubicacion.push(usuarioData.pais);
            
            if (ubicacion.length > 0) {
                userInfoHTML = `
                    <div style="margin-top: 5px; font-size: 13px; color: #7f8c8d;">
                        <i class="fas fa-map-marker-alt"></i> ${ubicacion.join(', ')}
                    </div>
                `;
            }
        }
        
        const publicacionHTML = `
            <div class="publicacion-item" id="publicacion-${publicacion.id}">
                <div class="publicacion-header">
                    ${avatarHTML}
                    <div class="publicacion-info">
                        <h4 onclick="mostrarPerfilCompleto('${publicacion.usuario_id}')" style="cursor: pointer; color: #667eea;">${nombreAutor}</h4>
                        ${userInfoHTML}
                        <div class="publicacion-meta">
                            <span><i class="far fa-clock"></i> ${fecha}</span>
                            <span><i class="fas fa-globe-americas"></i> Pública</span>
                            <span><i class="fas fa-${publicacion.tipo === 'imagen' ? 'image' : publicacion.tipo === 'video' ? 'video' : 'link'}"></i> ${publicacion.tipo}</span>
                        </div>
                    </div>
                </div>
                
                <div class="publicacion-contenido">
                    ${publicacion.contenido ? `
                        <div class="publicacion-texto">${publicacion.contenido}</div>
                    ` : ''}
                    
                    ${mediaHTML}
                </div>
                
                <div class="publicacion-stats">
                    <div class="stat-item">
                        <i class="fas fa-heart"></i>
                        <span>${publicacion.likes_count || 0} likes</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-comment"></i>
                        <span>${publicacion.comentarios_count || 0} comentarios</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-share-alt"></i>
                        <span>Compartida</span>
                    </div>
                </div>
                
                ${usuarioData && usuarioData.biografia ? `
                    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #e8edf2;">
                        <p style="font-size: 14px; color: #5d6d7e; font-style: italic;">
                            <i class="fas fa-quote-left" style="color: #667eea; margin-right: 5px;"></i>
                            ${usuarioData.biografia}
                        </p>
                    </div>
                ` : ''}
            </div>
        `;
        
        container.innerHTML = publicacionHTML;
        container.style.display = 'block';
        
        setTimeout(() => {
            const pubElement = document.getElementById(`publicacion-${publicacion.id}`);
            if (pubElement) {
                pubElement.style.opacity = '1';
                pubElement.style.transform = 'translateY(0)';
            }
        }, 100);
    }
    
    function mostrarError(mensaje) {
        const loading = document.getElementById('loading');
        const errorContainer = document.getElementById('errorContainer');
        
        loading.style.display = 'none';
        errorContainer.innerHTML = `
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error</h3>
            <p>${mensaje}</p>
            <div class="actions" style="margin-top: 30px; justify-content: center;">
                <a href="configuracion.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Ir a Messery
                </a>
                <button class="btn btn-secondary" onclick="window.location.reload()">
                    <i class="fas fa-redo"></i> Reintentar
                </button>
            </div>
        `;
        errorContainer.style.display = 'block';
    }
    
    function abrirImagenEnGrande(url) {
        Swal.fire({
            imageUrl: url,
            imageAlt: 'Imagen de la publicación',
            showCloseButton: true,
            showConfirmButton: false,
            background: 'rgba(0,0,0,0.9)',
            backdrop: 'rgba(0,0,0,0.9)',
            padding: '0',
            width: '90%',
            heightAuto: true,
            imageHeight: 'auto',
            imageWidth: '100%'
        });
    }
    
    function extraerIdYouTube(url) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(regex);
        return match ? match[1] : null;
    }
    
    // ======================
    // INICIALIZACIÓN
    // ======================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Página view.html cargada');
        
        const urlParams = new URLSearchParams(window.location.search);
        publicacionId = urlParams.get('id');
        
        if (!publicacionId) {
            mostrarError('❌ No se especificó ninguna publicación para ver');
            return;
        }
        
        console.log('📌 ID de publicación:', publicacionId);
        
        const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        if (!uuidRegex.test(publicacionId)) {
            mostrarError('❌ ID de publicación inválido');
            return;
        }
        
        setTimeout(() => {
            cargarPublicacion();
        }, 500);
    });
</script>
</body>
</html>
