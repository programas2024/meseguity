<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicación Compartida - Messery</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,112C672,96,768,96,864,112C960,128,1056,160,1152,160C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            opacity: 0.2;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header h1 i {
            color: #ffffff;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .content {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 18px;
        }
        
        .loading i {
            font-size: 40px;
            margin-bottom: 20px;
        }
        
        .publicacion-container {
            margin-top: 20px;
        }
        
        .publicacion-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #e8edf2;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .publicacion-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e8edf2;
        }
        
        .publicacion-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .publicacion-avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .publicacion-info h4 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .publicacion-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .publicacion-contenido {
            margin: 20px 0;
        }
        
        .publicacion-texto {
            font-size: 16px;
            line-height: 1.6;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .publicacion-media {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .publicacion-media img, .publicacion-media video {
            width: 100%;
            border-radius: 10px;
            display: block;
        }
        
        .publicacion-enlace {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            text-decoration: none;
            color: #2c3e50;
            transition: all 0.3s;
        }
        
        .publicacion-enlace:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }
        
        .publicacion-enlace i {
            font-size: 24px;
            color: #667eea;
        }
        
        .publicacion-stats {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #e8edf2;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-item i {
            font-size: 18px;
        }
        
        .stat-item .fa-heart { color: #e74c3c; }
        .stat-item .fa-comment { color: #3498db; }
        .stat-item .fa-share-alt { color: #2ecc71; }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            font-size: 16px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e8edf2;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .error-message {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }
        
        .error-message i {
            font-size: 50px;
            margin-bottom: 20px;
        }
        
        .login-prompt {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            border-left: 5px solid #667eea;
            animation: fadeIn 0.5s ease;
        }
        
        .login-prompt h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .login-prompt p {
            color: #5d6d7e;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Estilos para el modal de perfil */
        .profile-modal .swal2-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 0;
            padding: 20px;
        }
        
        .profile-modal .swal2-title {
            color: white;
            font-size: 24px;
        }
        
        .profile-modal .swal2-close {
            color: white;
        }
        
        .profile-modal .swal2-html-container {
            padding: 20px;
            text-align: left;
        }
        
        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .profile-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .profile-info-item i {
            color: #667eea;
            font-size: 18px;
            width: 25px;
        }
        
        .profile-info-item span {
            color: #2c3e50;
            font-weight: 500;
        }
        
        .profile-info-item .value {
            color: #5d6d7e;
            margin-left: 5px;
        }
        
        .share-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .share-option:hover {
            transform: translateY(-3px);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .share-option i {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .share-option.whatsapp i { color: #25D366; }
        .share-option.facebook i { color: #1877F2; }
        .share-option.word i { color: #2B579A; }
        .share-option.powerpoint i { color: #D24726; }
        .share-option.link i { color: #667eea; }
        
        @media (max-width: 768px) {
            .container {
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .content {
                padding: 20px;
            }
            
            .publicacion-item {
                padding: 20px;
            }
            
            .publicacion-stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .share-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .content {
                padding: 15px;
            }
            
            .publicacion-header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .share-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1><i class="fas fa-share-alt"></i> Publicación Compartida</h1>
                <p>Estás viendo una publicación compartida desde Messery</p>
            </div>
        </div>
        
        <div class="content">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando publicación...</p>
            </div>
            
            <div id="publicacionContainer" class="publicacion-container" style="display: none;"></div>
            
            <div id="errorContainer" class="error-message" style="display: none;"></div>
            
            <div class="login-prompt" id="loginPrompt" style="display: none;">
                <h3><i class="fas fa-heart"></i> ¿Te gusta esta publicación?</h3>
                <p>Únete a Messery para crear tus propias publicaciones, dar likes, comentar y compartir contenido.</p>
                <div class="actions">
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                    </a>
                    <a href="registro.html" class="btn btn-secondary">
                        <i class="fas fa-user-plus"></i> Registrarse
                    </a>
                    <button class="btn btn-secondary" onclick="mostrarOpcionesCompartir()">
                        <i class="fas fa-share-alt"></i> Compartir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ======================
        // CONFIGURACIÓN SUPABASE (TUS CREDENCIALES)
        // ======================
        const SUPABASE_URL = 'https://enmiomqkkdlmodrjmfak.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVubWlvbXFra2RsbW9kcmptZmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MDA0OTEsImV4cCI6MjA4MDk3NjQ5MX0.HeiJGnnkUjutlZkMTopFK7AIRZzRLxBTXvWk96OcAxg';
        
        // Crear cliente Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // ======================
        // VARIABLES GLOBALES
        // ======================
        let publicacionId = null;
        let publicacionActual = null;
        let usuarioActual = null;
        
        // ======================
        // DETECCIÓN DE DISPOSITIVO
        // ======================
        const esMovil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // ======================
        // FUNCIÓN PARA OBTENER DATOS DEL USUARIO (SIN SESIÓN)
        // ======================
        async function obtenerDatosUsuario(userId) {
            console.log('🔍 Obteniendo datos del usuario ID:', userId);
            
            // PRIMERO: Intentar con la función RPC que crearemos
            try {
                console.log('🔄 Intentando obtener datos con RPC...');
                const { data: rpcData, error: rpcError } = await supabaseClient.rpc(
                    'get_public_user_data',
                    { user_uuid: userId }
                );
                
                if (!rpcError && rpcData && rpcData.length > 0) {
                    console.log('✅ Datos obtenidos via RPC:', rpcData[0]);
                    return rpcData[0];
                } else if (rpcError) {
                    console.log('⚠️ Función RPC no disponible:', rpcError.message);
                }
            } catch (rpcError) {
                console.log('⚠️ Error en RPC:', rpcError.message);
            }
            
            // SEGUNDO: Si RPC falla, intentar directamente (puede fallar por RLS)
            try {
                console.log('🔄 Intentando obtener datos directamente...');
                const { data, error } = await supabaseClient
                    .from('usuarios')
                    .select('nombre, apellidos, avatar_url, email, pais, ciudad, biografia, perfil_publico')
                    .eq('id', userId)
                    .maybeSingle();
                
                if (!error && data) {
                    console.log('✅ Datos obtenidos directamente:', data);
                    // Guardar en localStorage para futuras visitas
                    try {
                        localStorage.setItem(`user_${userId}`, JSON.stringify(data));
                    } catch (e) {
                        console.log('⚠️ No se pudo guardar en localStorage');
                    }
                    return data;
                } else if (error) {
                    console.log('⚠️ Error directo (probablemente RLS):', error.message);
                }
            } catch (error) {
                console.log('⚠️ Error en consulta directa:', error.message);
            }
            
            // TERCERO: Verificar si hay datos almacenados localmente
            try {
                const storedKey = `user_${userId}`;
                const storedData = localStorage.getItem(storedKey);
                if (storedData) {
                    const parsed = JSON.parse(storedData);
                    console.log('✅ Datos obtenidos de localStorage:', parsed);
                    return parsed;
                }
            } catch (error) {
                console.log('⚠️ Error obteniendo de localStorage:', error.message);
            }
            
            // CUARTO: Datos por defecto (fallback)
            console.log('⚠️ Usando datos por defecto');
            return {
                nombre: `Usuario_${userId.substring(0, 8)}`,
                avatar_url: null,
                email: null
            };
        }
        
        // ======================
        // FUNCIÓN PARA MOSTRAR PERFIL DEL USUARIO
        // ======================
        function mostrarPerfilUsuario(usuarioData) {
            // Verificar si tenemos datos suficientes
            if (!usuarioData || (!usuarioData.nombre && !usuarioData.email)) {
                Swal.fire({
                    icon: 'info',
                    title: 'Información del usuario',
                    text: 'No hay información pública disponible para este usuario.',
                    confirmButtonColor: '#667eea'
                });
                return;
            }
            
            const nombreCompleto = usuarioData.nombre ? 
                (usuarioData.apellidos ? `${usuarioData.nombre} ${usuarioData.apellidos}` : usuarioData.nombre) :
                'Usuario Messery';
            
            const avatarUrl = usuarioData.avatar_url;
            
            let avatarHTML = '';
            if (avatarUrl) {
                avatarHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <img src="${avatarUrl}" 
                             alt="Avatar de ${nombreCompleto}"
                             style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid #667eea;">
                    </div>
                `;
            } else {
                avatarHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: inline-flex; align-items: center; justify-content: center; border: 4px solid #667eea;">
                            <i class="fas fa-user-circle" style="font-size: 60px; color: white;"></i>
                        </div>
                    </div>
                `;
            }
            
            let infoHTML = `
                <div class="profile-info">
                    <div class="profile-info-item">
                        <i class="fas fa-user"></i>
                        <span>Nombre:</span>
                        <span class="value">${nombreCompleto}</span>
                    </div>
            `;
            
            if (usuarioData.email) {
                infoHTML += `
                    <div class="profile-info-item">
                        <i class="fas fa-envelope"></i>
                        <span>Email:</span>
                        <span class="value">${usuarioData.email}</span>
                    </div>
                `;
            }
            
            if (usuarioData.pais || usuarioData.ciudad) {
                const ubicacion = [];
                if (usuarioData.ciudad) ubicacion.push(usuarioData.ciudad);
                if (usuarioData.pais) ubicacion.push(usuarioData.pais);
                
                infoHTML += `
                    <div class="profile-info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Ubicación:</span>
                        <span class="value">${ubicacion.join(', ')}</span>
                    </div>
                `;
            }
            
            if (usuarioData.biografia) {
                infoHTML += `
                    <div class="profile-info-item" style="flex-direction: column; align-items: flex-start;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <i class="fas fa-quote-left"></i>
                            <span>Biografía:</span>
                        </div>
                        <span class="value" style="font-style: italic; color: #5d6d7e;">${usuarioData.biografia}</span>
                    </div>
                `;
            }
            
            infoHTML += '</div>';
            
            Swal.fire({
                title: 'Perfil del Usuario',
                html: avatarHTML + infoHTML,
                showCloseButton: true,
                showConfirmButton: true,
                confirmButtonText: 'Cerrar',
                confirmButtonColor: '#667eea',
                customClass: {
                    popup: 'profile-modal',
                    closeButton: 'swal2-close'
                },
                width: 500,
                background: 'white',
                color: '#2c3e50'
            });
        }
        
        // ======================
        // FUNCIÓN PARA MOSTRAR OPCIONES DE COMPARTIR
        // ======================
        function mostrarOpcionesCompartir() {
            if (!publicacionActual) return;
            
            const currentUrl = window.location.href;
            const titulo = '¡Mira esta publicación de Messery!';
            const texto = 'He encontrado esta publicación interesante en Messery';
            
            const shareHTML = `
                <div style="text-align: center;">
                    <p style="margin-bottom: 20px; color: #2c3e50;">Comparte esta publicación:</p>
                    
                    <input type="text" id="shareUrl" value="${currentUrl}" readonly 
                           style="width:100%; padding:12px; border:2px solid #e8edf2; border-radius:8px; margin-bottom: 20px; font-size: 14px;">
                    
                    <div class="share-options">
                        <div class="share-option link" onclick="copiarEnlace()">
                            <i class="fas fa-copy"></i>
                            <span style="font-size: 12px; color: #5d6d7e;">Copiar Link</span>
                        </div>
                        
                        <div class="share-option whatsapp" onclick="compartirWhatsApp('${currentUrl}', '${texto}')">
                            <i class="fab fa-whatsapp"></i>
                            <span style="font-size: 12px; color: #5d6d7e;">WhatsApp</span>
                        </div>
                        
                        <div class="share-option facebook" onclick="compartirFacebook('${currentUrl}')">
                            <i class="fab fa-facebook"></i>
                            <span style="font-size: 12px; color: #5d6d7e;">Facebook</span>
                        </div>
                        
                        <div class="share-option word" onclick="compartirWord('${currentUrl}', '${titulo}')">
                            <i class="fab fa-microsoft"></i>
                            <span style="font-size: 12px; color: #5d6d7e;">Word</span>
                        </div>
                        
                        <div class="share-option powerpoint" onclick="compartirPowerPoint('${currentUrl}', '${titulo}')">
                            <i class="fas fa-chart-line"></i>
                            <span style="font-size: 12px; color: #5d6d7e;">PowerPoint</span>
                        </div>
                        
                        <div class="share-option" onclick="compartirEmail('${currentUrl}', '${titulo}', '${texto}')">
                            <i class="fas fa-envelope"></i>
                            <span style="font-size: 12px; color: #5d6d7e;">Email</span>
                        </div>
                    </div>
                </div>
            `;
            
            Swal.fire({
                title: 'Compartir Publicación',
                html: shareHTML,
                showCloseButton: true,
                showConfirmButton: false,
                width: 500,
                customClass: {
                    popup: 'profile-modal'
                }
            });
        }
        
        // ======================
        // FUNCIONES DE COMPARTIR
        // ======================
        function copiarEnlace() {
            const input = document.getElementById('shareUrl');
            if (!input) return;
            
            input.select();
            input.setSelectionRange(0, 99999);
            
            try {
                navigator.clipboard.writeText(input.value).then(() => {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Copiado!',
                        text: 'Enlace copiado al portapapeles',
                        timer: 2000,
                        showConfirmButton: false
                    });
                });
            } catch (err) {
                document.execCommand('copy');
                Swal.fire({
                    icon: 'success',
                    title: '¡Copiado!',
                    text: 'Enlace copiado al portapapeles',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        }
        
        function compartirWhatsApp(url, texto) {
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(texto + ' ' + url)}`;
            window.open(whatsappUrl, '_blank');
        }
        
        function compartirFacebook(url) {
            const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
            window.open(facebookUrl, '_blank');
        }
        
        function compartirWord(url, titulo) {
            const contenido = `${titulo}\n\n${url}\n\nCompartido desde Messery`;
            const blob = new Blob([contenido], { type: 'text/plain' });
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = 'Publicacion-Messery.txt';
            a.click();
            URL.revokeObjectURL(blobUrl);
            
            Swal.fire({
                icon: 'success',
                title: 'Descargado',
                text: 'El contenido ha sido preparado para Word',
                timer: 2000,
                showConfirmButton: false
            });
        }
        
        function compartirPowerPoint(url, titulo) {
            const contenido = `Título: ${titulo}\nURL: ${url}\nFecha: ${new Date().toLocaleDateString()}\n\nCompartido desde Messery`;
            const blob = new Blob([contenido], { type: 'text/plain' });
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = 'Presentacion-Messery.txt';
            a.click();
            URL.revokeObjectURL(blobUrl);
            
            Swal.fire({
                icon: 'success',
                title: 'Descargado',
                text: 'El contenido ha sido preparado para PowerPoint',
                timer: 2000,
                showConfirmButton: false
            });
        }
        
        function compartirEmail(url, titulo, texto) {
            const subject = encodeURIComponent(titulo);
            const body = encodeURIComponent(`${texto}\n\n${url}`);
            const mailtoUrl = `mailto:?subject=${subject}&body=${body}`;
            window.location.href = mailtoUrl;
        }
        
        // ======================
        // FUNCIONES PRINCIPALES
        // ======================
        async function cargarPublicacion() {
            try {
                console.log('🔄 Cargando publicación ID:', publicacionId);
                console.log('📱 Dispositivo:', esMovil ? 'Móvil' : 'PC/Desktop');
                
                if (!publicacionId) {
                    throw new Error('No se especificó ID de publicación');
                }
                
                // PASO 1: Obtener la publicación básica (esto siempre debería funcionar)
                const { data: publicacion, error } = await supabaseClient
                    .from('publicaciones')
                    .select('*')
                    .eq('id', publicacionId)
                    .single();
                
                if (error) {
                    console.error('Error Supabase:', error);
                    if (error.code === 'PGRST116') {
                        throw new Error('Publicación no encontrada');
                    }
                    throw new Error('Error al cargar la publicación: ' + error.message);
                }
                
                if (!publicacion) {
                    throw new Error('Publicación no encontrada');
                }
                
                // Guardar publicación actual
                publicacionActual = publicacion;
                
                // Verificar que sea pública
                if (publicacion.visibilidad !== 'publico') {
                    mostrarError('🔒 Esta publicación es privada y no está disponible para ver públicamente');
                    return;
                }
                
                console.log('✅ Publicación cargada:', publicacion);
                
                // PASO 2: Obtener datos del usuario (usando RPC como primer método)
                usuarioActual = await obtenerDatosUsuario(publicacion.usuario_id);
                console.log('👤 Datos finales del usuario:', usuarioActual);
                
                // Mostrar la publicación
                mostrarPublicacion(publicacion, usuarioActual);
                
                // Mostrar prompt de login después de 1 segundo
                setTimeout(() => {
                    document.getElementById('loginPrompt').style.display = 'block';
                }, 1000);
                
            } catch (error) {
                console.error('❌ Error cargando publicación:', error);
                mostrarError(error.message || 'No se pudo cargar la publicación');
            }
        }
        
        function mostrarPublicacion(publicacion, usuarioData) {
            const container = document.getElementById('publicacionContainer');
            const loading = document.getElementById('loading');
            
            // Ocultar loading
            loading.style.display = 'none';
            
            // Formatear fecha
            const fecha = new Date(publicacion.fecha_creacion).toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // ============================================
            // PROCESAR DATOS DEL USUARIO
            // ============================================
            let nombreAutor = 'Usuario Messery';
            let avatarUrl = null;
            
            if (usuarioData) {
                // Obtener nombre completo
                if (usuarioData.nombre) {
                    nombreAutor = usuarioData.apellidos 
                        ? `${usuarioData.nombre} ${usuarioData.apellidos}`
                        : usuarioData.nombre;
                } else if (usuarioData.email) {
                    // Si no hay nombre, usar email
                    const nombreEmail = usuarioData.email.split('@')[0];
                    nombreAutor = nombreEmail.charAt(0).toUpperCase() + nombreEmail.slice(1);
                } else {
                    // Si no hay nada, usar el ID
                    nombreAutor = `Usuario_${publicacion.usuario_id.substring(0, 8)}`;
                }
                
                avatarUrl = usuarioData.avatar_url;
            }
            
            console.log('🎨 Mostrando publicación con:', {
                nombreAutor,
                avatarUrl
            });
            
            // Generar contenido HTML según el tipo
            let mediaHTML = '';
            if (publicacion.url_media) {
                switch(publicacion.tipo) {
                    case 'imagen':
                        mediaHTML = `
                            <div class="publicacion-media">
                                <img src="${publicacion.url_media}" 
                                     alt="Imagen publicada" 
                                     loading="lazy"
                                     onclick="abrirImagenEnGrande('${publicacion.url_media}')"
                                     style="cursor: pointer; max-height: 500px; object-fit: contain;"
                                     onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='<p style=\\'color:#e74c3c; padding:20px; text-align:center;\\'><i class=\\'fas fa-exclamation-triangle\\'></i> No se pudo cargar la imagen</p>';">
                            </div>
                        `;
                        break;
                        
                    case 'video':
                        if (publicacion.url_media.includes('youtube.com') || publicacion.url_media.includes('youtu.be')) {
                            const videoId = extraerIdYouTube(publicacion.url_media);
                            if (videoId) {
                                mediaHTML = `
                                    <div class="publicacion-media">
                                        <iframe 
                                            width="100%" 
                                            height="400" 
                                            src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1" 
                                            frameborder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                            allowfullscreen
                                            loading="lazy">
                                        </iframe>
                                    </div>
                                `;
                            }
                        } else {
                            mediaHTML = `
                                <div class="publicacion-media">
                                    <video width="100%" controls style="border-radius: 10px;">
                                        <source src="${publicacion.url_media}" type="video/mp4">
                                        Tu navegador no soporta el video.
                                    </video>
                                </div>
                            `;
                        }
                        break;
                        
                    case 'enlace':
                        let dominio = 'Enlace compartido';
                        try {
                            const urlObj = new URL(publicacion.url_media);
                            dominio = urlObj.hostname.replace('www.', '');
                        } catch (e) {
                            console.warn('URL inválida:', publicacion.url_media);
                        }
                        
                        mediaHTML = `
                            <a href="${publicacion.url_media}" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               class="publicacion-enlace">
                                <i class="fas fa-external-link-alt"></i>
                                <div>
                                    <strong>Enlace compartido</strong><br>
                                    <small>${dominio}</small>
                                </div>
                            </a>
                        `;
                        break;
                }
            }
            
            // ============================================
            // HTML DEL AVATAR CON CLICK PARA PERFIL
            // ============================================
            let avatarHTML = '';

            if (avatarUrl) {
                avatarHTML = `
                    <div class="publicacion-avatar" onclick="mostrarPerfilUsuario(usuarioActual)" style="position: relative; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #667eea; cursor: pointer;">
                        <img src="${avatarUrl}" 
                             alt="Avatar de ${nombreAutor}"
                             style="width: 100%; height: 100%; object-fit: cover;"
                             onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-user-circle\\' style=\\'font-size: 32px; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);\\'></i>';">
                    </div>
                `;
            } else {
                // Fallback a icono si no hay avatar
                avatarHTML = `
                    <div class="publicacion-avatar" onclick="mostrarPerfilUsuario(usuarioActual)" style="display: flex; align-items: center; justify-content: center; background: #667eea; cursor: pointer;">
                        <i class="fas fa-user-circle" style="font-size: 32px; color: white;"></i>
                    </div>
                `;
            }
            
            // Mostrar información adicional del usuario si está disponible
            let userInfoHTML = '';
            if (usuarioData && (usuarioData.pais || usuarioData.ciudad)) {
                const ubicacion = [];
                if (usuarioData.ciudad) ubicacion.push(usuarioData.ciudad);
                if (usuarioData.pais) ubicacion.push(usuarioData.pais);
                
                if (ubicacion.length > 0) {
                    userInfoHTML = `
                        <div style="margin-top: 5px; font-size: 13px; color: #7f8c8d;">
                            <i class="fas fa-map-marker-alt"></i> ${ubicacion.join(', ')}
                        </div>
                    `;
                }
            }
            
            // Crear HTML de la publicación
            const publicacionHTML = `
                <div class="publicacion-item" id="publicacion-${publicacion.id}">
                    <div class="publicacion-header">
                        ${avatarHTML}
                        <div class="publicacion-info">
                            <h4 style="color: #2c3e50; margin: 0 0 5px 0; cursor: pointer;" onclick="mostrarPerfilUsuario(usuarioActual)">${nombreAutor}</h4>
                            ${userInfoHTML}
                            <div class="publicacion-meta">
                                <span><i class="far fa-clock"></i> ${fecha}</span>
                                <span><i class="fas fa-globe-americas"></i> Pública</span>
                                <span><i class="fas fa-${publicacion.tipo === 'imagen' ? 'image' : publicacion.tipo === 'video' ? 'video' : 'link'}"></i> ${publicacion.tipo}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="publicacion-contenido">
                        ${publicacion.contenido ? `
                            <div class="publicacion-texto">${publicacion.contenido}</div>
                        ` : ''}
                        
                        ${mediaHTML}
                    </div>
                    
                    <div class="publicacion-stats">
                        <div class="stat-item">
                            <i class="fas fa-heart"></i>
                            <span>${publicacion.likes_count || 0} likes</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-comment"></i>
                            <span>${publicacion.comentarios_count || 0} comentarios</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-share-alt"></i>
                            <span>Compartida</span>
                        </div>
                    </div>
                    
                    ${usuarioData && usuarioData.biografia ? `
                        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #e8edf2;">
                            <p style="font-size: 14px; color: #5d6d7e; font-style: italic;">
                                <i class="fas fa-quote-left" style="color: #667eea; margin-right: 5px;"></i>
                                ${usuarioData.biografia}
                            </p>
                        </div>
                    ` : ''}
                </div>
            `;
            
            // Insertar en el contenedor
            container.innerHTML = publicacionHTML;
            container.style.display = 'block';
            
            // Animación de entrada
            setTimeout(() => {
                const pubElement = document.getElementById(`publicacion-${publicacion.id}`);
                if (pubElement) {
                    pubElement.style.opacity = '1';
                    pubElement.style.transform = 'translateY(0)';
                }
            }, 100);
        }
        
        function mostrarError(mensaje) {
            const loading = document.getElementById('loading');
            const errorContainer = document.getElementById('errorContainer');
            
            loading.style.display = 'none';
            errorContainer.innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Error</h3>
                <p>${mensaje}</p>
                <div class="actions" style="margin-top: 30px; justify-content: center;">
                    <a href="configuracion.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> Ir a Messery
                    </a>
                    <button class="btn btn-secondary" onclick="window.location.reload()">
                        <i class="fas fa-redo"></i> Reintentar
                    </button>
                </div>
            `;
            errorContainer.style.display = 'block';
        }
        
        function abrirImagenEnGrande(url) {
            Swal.fire({
                imageUrl: url,
                imageAlt: 'Imagen de la publicación',
                showCloseButton: true,
                showConfirmButton: false,
                background: 'rgba(0,0,0,0.9)',
                backdrop: 'rgba(0,0,0,0.9)',
                padding: '0',
                width: '90%',
                heightAuto: true,
                imageHeight: 'auto',
                imageWidth: '100%'
            });
        }
        
        function extraerIdYouTube(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }
        
        // ======================
        // INICIALIZACIÓN
        // ======================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Página view.html cargada');
            console.log('📱 Navegador:', navigator.userAgent);
            console.log('🖥️ Plataforma:', navigator.platform);
            console.log('📱 Es dispositivo móvil:', esMovil);
            
            // Limpiar caché específica en móviles si es necesario
            if (esMovil) {
                console.log('📱 Dispositivo móvil detectado');
                try {
                    // Limpiar solo items específicos, no todo
                    const keysToRemove = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key.startsWith('supabase.auth.')) {
                            keysToRemove.push(key);
                        }
                    }
                    keysToRemove.forEach(key => localStorage.removeItem(key));
                } catch (e) {
                    console.log('⚠️ No se pudo limpiar caché:', e);
                }
            }
            
            // Obtener ID de publicación de la URL
            const urlParams = new URLSearchParams(window.location.search);
            publicacionId = urlParams.get('id');
            
            if (!publicacionId) {
                mostrarError('❌ No se especificó ninguna publicación para ver');
                return;
            }
            
            console.log('📌 ID de publicación:', publicacionId);
            
            // Validar que sea un UUID válido
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            if (!uuidRegex.test(publicacionId)) {
                mostrarError('❌ ID de publicación inválido');
                return;
            }
            
            // Cargar la publicación después de 500ms (para asegurar que todo esté listo)
            setTimeout(() => {
                cargarPublicacion();
            }, 500);
        });
        
        // Manejar errores globales
        window.addEventListener('error', function(e) {
            console.error('❌ Error global:', e.error);
        });
    </script>
