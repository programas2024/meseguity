<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicación Compartida - Messery</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header h1 i {
            color: #2ecc71;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .content {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 18px;
        }
        
        .loading i {
            font-size: 40px;
            margin-bottom: 20px;
        }
        
        .publicacion-container {
            margin-top: 20px;
        }
        
        .publicacion-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #e8edf2;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .publicacion-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e8edf2;
        }
        
        .publicacion-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
        
        .publicacion-info h4 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .publicacion-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .publicacion-contenido {
            margin: 20px 0;
        }
        
        .publicacion-texto {
            font-size: 16px;
            line-height: 1.6;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .publicacion-media {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .publicacion-media img, .publicacion-media video {
            width: 100%;
            border-radius: 10px;
            display: block;
        }
        
        .publicacion-enlace {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            text-decoration: none;
            color: #2c3e50;
            transition: all 0.3s;
        }
        
        .publicacion-enlace:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }
        
        .publicacion-enlace i {
            font-size: 24px;
            color: #667eea;
        }
        
        .publicacion-stats {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #e8edf2;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-item i {
            font-size: 18px;
        }
        
        .stat-item .fa-heart { color: #e74c3c; }
        .stat-item .fa-comment { color: #3498db; }
        .stat-item .fa-share-alt { color: #2ecc71; }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            font-size: 16px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e8edf2;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .error-message {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }
        
        .error-message i {
            font-size: 50px;
            margin-bottom: 20px;
        }
        
        .login-prompt {
            background: rgba(52, 152, 219, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            border-left: 5px solid #3498db;
            animation: fadeIn 0.5s ease;
        }
        
        .login-prompt h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .login-prompt p {
            color: #5d6d7e;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .container {
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .content {
                padding: 20px;
            }
            
            .publicacion-item {
                padding: 20px;
            }
            
            .publicacion-stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .content {
                padding: 15px;
            }
            
            .publicacion-header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-share-alt"></i> Publicación Compartida</h1>
            <p>Estás viendo una publicación compartida desde Messery</p>
        </div>
        
        <div class="content">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando publicación...</p>
            </div>
            
            <div id="publicacionContainer" class="publicacion-container" style="display: none;"></div>
            
            <div id="errorContainer" class="error-message" style="display: none;"></div>
            
            <div class="login-prompt" id="loginPrompt" style="display: none;">
                <h3><i class="fas fa-sign-in-alt"></i> ¿Te gusta esta publicación?</h3>
                <p>Inicia sesión en Messery para crear tus propias publicaciones, dar likes, comentar y compartir contenido.</p>
                <div class="actions">
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                    </a>
                    <a href="configuracion.html" class="btn btn-secondary">
                        <i class="fas fa-home"></i> Ir a Messery
                    </a>
                    <button class="btn btn-secondary" onclick="compartirPublicacion()">
                        <i class="fas fa-share-alt"></i> Compartir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ======================
        // CONFIGURACIÓN SUPABASE (TUS CREDENCIALES)
        // ======================
        const SUPABASE_URL = 'https://enmiomqkkdlmodrjmfak.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVubWlvbXFra2RsbW9kcmptZmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MDA0OTEsImV4cCI6MjA4MDk3NjQ5MX0.HeiJGnnkUjutlZkMTopFK7AIRZzRLxBTXvWk96OcAxg';
        
        // Crear cliente Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // ======================
        // VARIABLES GLOBALES
        // ======================
        let publicacionId = null;
        let publicacionActual = null;
        
        // ======================
        // FUNCIONES PRINCIPALES
        // ======================
        async function cargarPublicacion() {
            try {
                console.log('🔄 Cargando publicación ID:', publicacionId);
                
                if (!publicacionId) {
                    throw new Error('No se especificó ID de publicación');
                }
                
                // Obtener publicación desde Supabase
                const { data: publicacion, error } = await supabase
                    .from('publicaciones')
                    .select(`
                        *,
                        usuarios (
                            nombre,
                            avatar_url
                        )
                    `)
                    .eq('id', publicacionId)
                    .single();
                
                if (error) {
                    console.error('Error Supabase:', error);
                    if (error.code === 'PGRST116') {
                        throw new Error('Publicación no encontrada');
                    }
                    throw new Error('Error al cargar la publicación: ' + error.message);
                }
                
                if (!publicacion) {
                    throw new Error('Publicación no encontrada');
                }
                
                // Guardar publicación actual
                publicacionActual = publicacion;
                
                // Verificar que sea pública
                if (publicacion.visibilidad !== 'publico') {
                    mostrarError('🔒 Esta publicación es privada y no está disponible para ver públicamente');
                    return;
                }
                
                console.log('✅ Publicación cargada:', publicacion);
                
                // Mostrar la publicación
                mostrarPublicacion(publicacion);
                
                // Mostrar prompt de login después de 1 segundo
                setTimeout(() => {
                    document.getElementById('loginPrompt').style.display = 'block';
                }, 1000);
                
            } catch (error) {
                console.error('❌ Error cargando publicación:', error);
                mostrarError(error.message || 'No se pudo cargar la publicación');
            }
        }
        
        function mostrarPublicacion(publicacion) {
            const container = document.getElementById('publicacionContainer');
            const loading = document.getElementById('loading');
            
            // Ocultar loading
            loading.style.display = 'none';
            
            // Formatear fecha
            const fecha = new Date(publicacion.fecha_creacion).toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // Generar contenido HTML según el tipo
            let mediaHTML = '';
            if (publicacion.url_media) {
                switch(publicacion.tipo) {
                    case 'imagen':
                        mediaHTML = `
                            <div class="publicacion-media">
                                <img src="${publicacion.url_media}" 
                                     alt="Imagen publicada" 
                                     loading="lazy"
                                     onclick="abrirImagenEnGrande('${publicacion.url_media}')"
                                     style="cursor: pointer; max-height: 500px; object-fit: contain;">
                            </div>
                        `;
                        break;
                        
                    case 'video':
                        if (publicacion.url_media.includes('youtube.com') || publicacion.url_media.includes('youtu.be')) {
                            const videoId = extraerIdYouTube(publicacion.url_media);
                            if (videoId) {
                                mediaHTML = `
                                    <div class="publicacion-media">
                                        <iframe 
                                            width="100%" 
                                            height="400" 
                                            src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1" 
                                            frameborder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                            allowfullscreen
                                            loading="lazy">
                                        </iframe>
                                    </div>
                                `;
                            }
                        } else {
                            mediaHTML = `
                                <div class="publicacion-media">
                                    <video width="100%" controls style="border-radius: 10px;">
                                        <source src="${publicacion.url_media}" type="video/mp4">
                                        Tu navegador no soporta el video.
                                    </video>
                                </div>
                            `;
                        }
                        break;
                        
                    case 'enlace':
                        // Mostrar solo el dominio para que no sea tan largo
                        const urlObj = new URL(publicacion.url_media);
                        const dominio = urlObj.hostname;
                        
                        mediaHTML = `
                            <a href="${publicacion.url_media}" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               class="publicacion-enlace">
                                <i class="fas fa-external-link-alt"></i>
                                <div>
                                    <strong>Enlace compartido</strong><br>
                                    <small>${dominio}</small>
                                </div>
                            </a>
                        `;
                        break;
                }
            }
            
            // Crear HTML de la publicación
            const publicacionHTML = `
                <div class="publicacion-item" id="publicacion-${publicacion.id}">
                    <div class="publicacion-header">
                        <div class="publicacion-avatar">
                            ${publicacion.usuarios?.avatar_url 
                                ? `<img src="${publicacion.usuarios.avatar_url}" alt="Avatar" style="width:100%;height:100%;border-radius:50%;">`
                                : `<i class="fas fa-user-circle"></i>`
                            }
                        </div>
                        <div class="publicacion-info">
                            <h4>${publicacion.usuarios?.nombre || 'Usuario'}</h4>
                            <div class="publicacion-meta">
                                <span><i class="far fa-clock"></i> ${fecha}</span>
                                <span><i class="fas fa-globe-americas"></i> Pública</span>
                                <span><i class="fas fa-${publicacion.tipo === 'imagen' ? 'image' : publicacion.tipo === 'video' ? 'video' : 'link'}"></i> ${publicacion.tipo}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="publicacion-contenido">
                        ${publicacion.contenido ? `
                            <div class="publicacion-texto">${publicacion.contenido}</div>
                        ` : ''}
                        
                        ${mediaHTML}
                    </div>
                    
                    <div class="publicacion-stats">
                        <div class="stat-item">
                            <i class="fas fa-heart"></i>
                            <span>${publicacion.likes_count || 0} likes</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-comment"></i>
                            <span>${publicacion.comentarios_count || 0} comentarios</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-share-alt"></i>
                            <span>Compartida</span>
                        </div>
                    </div>
                </div>
            `;
            
            // Insertar en el contenedor
            container.innerHTML = publicacionHTML;
            container.style.display = 'block';
            
            // Animación de entrada
            setTimeout(() => {
                const pubElement = document.getElementById(`publicacion-${publicacion.id}`);
                if (pubElement) {
                    pubElement.style.opacity = '1';
                    pubElement.style.transform = 'translateY(0)';
                }
            }, 100);
        }
        
        function mostrarError(mensaje) {
            const loading = document.getElementById('loading');
            const errorContainer = document.getElementById('errorContainer');
            
            loading.style.display = 'none';
            errorContainer.innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Error</h3>
                <p>${mensaje}</p>
                <div class="actions" style="margin-top: 30px; justify-content: center;">
                    <a href="configuracion.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> Ir a Messery
                    </a>
                    <button class="btn btn-secondary" onclick="window.location.reload()">
                        <i class="fas fa-redo"></i> Reintentar
                    </button>
                </div>
            `;
            errorContainer.style.display = 'block';
        }
        
        function abrirImagenEnGrande(url) {
            Swal.fire({
                imageUrl: url,
                imageAlt: 'Imagen de la publicación',
                showCloseButton: true,
                showConfirmButton: false,
                background: 'rgba(0,0,0,0.9)',
                backdrop: 'rgba(0,0,0,0.9)',
                padding: '0',
                width: '90%',
                heightAuto: true,
                imageHeight: 'auto',
                imageWidth: '100%'
            });
        }
        
        function extraerIdYouTube(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }
        
        function compartirPublicacion() {
            if (!publicacionActual) return;
            
            const currentUrl = window.location.href;
            
            Swal.fire({
                title: 'Compartir publicación',
                html: `
                    <div style="text-align: left;">
                        <p>Comparte este enlace:</p>
                        <input type="text" id="shareUrl" value="${currentUrl}" readonly 
                               style="width:100%; padding:10px; border:2px solid #e8edf2; border-radius:8px; margin:10px 0;">
                        <div class="actions" style="margin-top: 15px;">
                            <button onclick="copiarEnlace()" 
                                    style="padding:10px 20px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer;">
                                <i class="fas fa-copy"></i> Copiar enlace
                            </button>
                        </div>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        }
        
        function copiarEnlace() {
            const input = document.getElementById('shareUrl');
            if (!input) return;
            
            input.select();
            input.setSelectionRange(0, 99999);
            
            try {
                navigator.clipboard.writeText(input.value).then(() => {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Copiado!',
                        text: 'Enlace copiado al portapapeles',
                        timer: 2000,
                        showConfirmButton: false
                    });
                });
            } catch (err) {
                document.execCommand('copy');
                Swal.fire({
                    icon: 'success',
                    title: '¡Copiado!',
                    text: 'Enlace copiado al portapapeles',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        }
        
        // ======================
        // INICIALIZACIÓN
        // ======================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Página view.html cargada');
            
            // Obtener ID de publicación de la URL
            const urlParams = new URLSearchParams(window.location.search);
            publicacionId = urlParams.get('id');
            
            if (!publicacionId) {
                mostrarError('❌ No se especificó ninguna publicación para ver');
                return;
            }
            
            console.log('📌 ID de publicación:', publicacionId);
            
            // Validar que sea un UUID válido
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            if (!uuidRegex.test(publicacionId)) {
                mostrarError('❌ ID de publicación inválido');
                return;
            }
            
            // Cargar la publicación después de 500ms (para asegurar que todo esté listo)
            setTimeout(() => {
                cargarPublicacion();
            }, 500);
        });
    </script>
</body>
</html>
