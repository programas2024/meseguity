<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/estilos.css" />
</head>

<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" placeholder="Ingresa tu correo" required />

            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" required />

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <hr />

        <!-- BOTÓN LOGIN CON GITHUB -->
        <button id="githubLogin" class="btn-submit" style="background:#333;">
            <i class="fab fa-github"></i>
            Ingresar con GitHub
        </button>

        <p>¿No tienes cuenta? <a href="registro.html">Registrarse</a></p>
    </div>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexión Supabase -->
    <script src="modulos/conexion-supabase2.js"></script>

    <script>
        // Esperar a que todo esté cargado
        document.addEventListener('DOMContentLoaded', async () => {
            // Función para manejar errores de login
            function mostrarErrorLogin(error) {
                let errorMessage = error.message;
                
                if (error.message.includes('Invalid login credentials')) {
                    errorMessage = "Credenciales incorrectas. Verifica tu email y contraseña.";
                } else if (error.message.includes('Email not confirmed')) {
                    errorMessage = "Por favor confirma tu email antes de iniciar sesión.";
                } else if (error.message.includes('User not found') || error.message.includes('Email not found')) {
                    errorMessage = "Usuario no encontrado. ¿Estás registrado?";
                } else if (error.message.includes('too many requests')) {
                    errorMessage = "Demasiados intentos. Por favor espera unos minutos.";
                }
                
                Swal.fire({ 
                    title: "Error en el inicio de sesión", 
                    text: errorMessage, 
                    icon: "error",
                    confirmButtonText: "Entendido"
                });
            }

            // ----------------- LOGIN NORMAL -----------------
            document.getElementById("loginForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                try {
                    const { data, error } = await window.supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        mostrarErrorLogin(error);
                        return;
                    }

                    // Verificar y registrar usuario en DB
                    const usuarioDB = await window.verificarYRegistrarUsuario();
                    
                    Swal.fire({
                        title: "¡Bienvenido!",
                        text: `Inicio de sesión exitoso para ${data.user.email}`,
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });

                    setTimeout(() => {
                        window.location.href = "principal.html";
                    }, 1500);

                } catch (catchError) {
                    console.error('Error inesperado:', catchError);
                    Swal.fire({ 
                        title: "Error inesperado", 
                        text: "Ocurrió un error inesperado. Por favor intenta nuevamente.", 
                        icon: "error" 
                    });
                }
            });

            // ----------------- LOGIN CON GITHUB -----------------
            document.getElementById("githubLogin").addEventListener("click", async () => {
                try {
                    const { data, error } = await window.supabase.auth.signInWithOAuth({
                        provider: "github",
                        options: {
                            redirectTo: window.location.origin + "/principal.html"
                        }
                    });

                    if (error) {
                        console.error('Error con GitHub OAuth:', error);
                        Swal.fire({
                            title: "Error con GitHub",
                            text: error.message,
                            icon: "error"
                        });
                    }
                } catch (error) {
                    console.error('Error en login con GitHub:', error);
                    Swal.fire({
                        title: "Error",
                        text: "No se pudo conectar con GitHub",
                        icon: "error"
                    });
                }
            });

            // Verificar si ya hay sesión activa
            try {
                const session = await window.verificarSesion();
                
                if (session) {
                    Swal.fire({
                        title: "Ya estás autenticado",
                        text: `Serás redirigido a la página principal...`,
                        icon: "info",
                        timer: 2000,
                        showConfirmButton: false
                    });
                    
                    setTimeout(() => {
                        window.location.href = "principal.html";
                    }, 2000);
                }
            } catch (error) {
                console.log('No hay sesión activa o error:', error);
            }
        });
    </script>
</body>
</html>
