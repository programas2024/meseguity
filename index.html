<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Meseguity | Conecta, Juega, Crece</title>
    
    <!-- Meta tags -->
    <meta name="theme-color" content="#2C3E50">
    <meta name="description" content="Plataforma de mensajería con juegos, comunidades y desarrollo de habilidades">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- SweetAlert -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Mis estilos -->
    <link rel="stylesheet" href="assets/estilos.css" />
    <link rel="stylesheet" href="assets/ayuda.css">
    <link rel="stylesheet" href="assets/
    inforlogin.css" />
</head>

<body>
    <div class="login-container">
        <!-- Botón de información -->
        <button class="info-button" id="infoButton">
            <i class="fas fa-info"></i>
        </button>
        
        <!-- Logo y título -->
        <div class="logo-container">
            <div class="logo">
                <i class="fas fa-comment-dots"></i>
                Meseguity
            </div>
            <p class="tagline">Conecta, juega y descubre con amigos alrededor del mundo</p>
        </div>
        
        <h2>Iniciar Sesión</h2>
        
        <!-- Formulario con íconos -->
        <form id="loginForm">
            <!-- Campo Email -->
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Correo Electrónico
                </label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        class="input-field email-field"
                        placeholder="ejemplo@correo.com" 
                        required 
                    />
                   
                </div>
            </div>
            
            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-key"></i> Contraseña
                </label>
                <div class="input-wrapper">
                    <div class="password-container">
                        <input 
                            type="password" 
                            id="password" 
                            class="input-field password-field password-input"
                            placeholder="Ingresa tu contraseña" 
                            required 
                        />
                       
                        <button 
                            type="button" 
                            class="password-toggle-btn"
                            id="togglePassword"
                            data-tooltip="Mostrar contraseña"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Indicador de fortaleza (opcional) -->
                <div class="password-strength hidden" id="passwordStrength">
                    <div class="strength-meter"></div>
                    <div class="strength-text"></div>
                </div>
            </div>
            
            <!-- Botón de submit -->
            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i>
                <span>Ingresar a la Plataforma</span>
            </button>
        </form>
        
        <!-- Separador -->
        <div class="divider">
            <span>O ingresa con</span>
        </div>
        
        <!-- Botón GitHub -->
        <button id="githubLogin" class="btn-submit">
            <i class="fab fa-github"></i>
            <span>Continuar con GitHub</span>
        </button>
        
        <!-- Enlaces -->
        <div class="links">
            <a href="registro.html" class="link-item">
                <i class="fas fa-user-plus"></i>
                Crear cuenta nueva
            </a>
            <a href="#" class="link-item" id="forgotPassword">
                <i class="fas fa-question-circle"></i>
                Recuperar contraseña
           
        </div>
        
        <!-- Footer -->
        <div class="footer">
           
            <p class="mt-2" style="font-size: 12px; color: #999;">
                <i class="fas fa-heart"></i> Diseñado para conectar personas de forma divertida
            </p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="modulos/conexion-supabase2.js"></script>
    <script src="modulos/informlogin.js"></script>
    <script src="modulos/password-toggle.js"></script>
    <script src="modulos/ayulogin.js"></script>

    <script>
       // ======================
// PASO 1: SI VIENE DE UN ENLACE COMPARTIDO, REDIRIGIR A CONFIGURACION.HTML
// ======================
function procesarParametrosURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const publicacionId = urlParams.get('publicacion');
    const section = urlParams.get('section');
    
    console.log('Procesando parámetros URL en index:', { publicacionId, section });
    
    // Si hay una publicación compartida, redirigir a configuracion.html
    if (publicacionId && section === 'publicaciones') {
        console.log('¡Enlace compartido detectado! Redirigiendo a configuracion.html...');
        
        // Guardar el ID en sessionStorage
        sessionStorage.setItem('publicacionCompartida', publicacionId);
        sessionStorage.setItem('sectionCompartida', section);
        
        // REDIRIGIR A CONFIGURACION.HTML, NO A PRINCIPAL.HTML
        window.location.href = "configuracion.html?publicacion=" + publicacionId + "&section=" + section;
        return true; // ¡IMPORTANTE! Indica que se redirigió
    }
    
    return false; // No hay publicación compartida
}

// ======================
// CÓDIGO PRINCIPAL DE INDEX.HTML
// ======================
document.addEventListener('DOMContentLoaded', async function() {
    console.log('DOM cargado en index.html');
    
    // PRIMERO: Verificar si hay parámetros de publicación compartida
    const tienePublicacionCompartida = procesarParametrosURL();
    if (tienePublicacionCompartida) {
        console.log('Redirigido a configuracion.html por publicación compartida');
        return; // SALIR - Ya se redirigió a configuracion.html
    }
    
    console.log('No hay publicación compartida, continuando con login normal...');
    
    // Verificar que supabase esté disponible
    if (!window.supabase || !window.supabaseClient) {
        console.error('Supabase no está disponible');
        Swal.fire({
            title: "Error de configuración",
            text: "No se pudo cargar el sistema de autenticación. Por favor recarga la página.",
            icon: "error"
        });
        return;
    }
    
    // Inicializar botón de información
    if (window.inicializarBotonInformacion) {
        window.inicializarBotonInformacion();
    }
    
    // Usar el cliente correcto
    const supabase = window.supabaseClient || window.supabase;
    
    // ----------------- VERIFICAR SESIÓN ACTIVA -----------------
    async function verificarSesionActiva() {
        try {
            const { data: { session }, error } = await supabase.auth.getSession();
            
            if (error) {
                console.error('Error al verificar sesión:', error);
                return null;
            }
            
            if (session) {
                console.log('Sesión activa encontrada:', session.user.email);
                return session;
            }
            
            return null;
        } catch (error) {
            console.error('Error en verificarSesionActiva:', error);
            return null;
        }
    }

    // Verificar sesión al cargar
    const session = await verificarSesionActiva();
    if (session) {
        Swal.fire({
            title: "Ya estás autenticado",
            text: `Serás redirigido a la página principal...`,
            icon: "info",
            timer: 2000,
            showConfirmButton: false
        });
        
        setTimeout(() => {
            window.location.href = "principal.html";
        }, 2000);
        return; // Salir para evitar configurar los event listeners
    }

    // ----------------- FUNCIÓN PARA MANEJAR ERRORES -----------------
    function mostrarErrorLogin(error) {
        let errorMessage = error.message;
        
        if (error.message.includes('Invalid login credentials')) {
            errorMessage = "Credenciales incorrectas. Verifica tu email y contraseña.";
        } else if (error.message.includes('Email not confirmed')) {
            errorMessage = "Por favor confirma tu email antes de iniciar sesión.";
        } else if (error.message.includes('User not found') || error.message.includes('Email not found')) {
            errorMessage = "Usuario no encontrado. ¿Estás registrado?";
        } else if (error.message.includes('too many requests')) {
            errorMessage = "Demasiados intentos. Por favor espera unos minutos.";
        }
        
        Swal.fire({ 
            title: "Error en el inicio de sesión", 
            text: errorMessage, 
            icon: "error",
            confirmButtonText: "Entendido"
        });
    }

    // ----------------- LOGIN NORMAL -----------------
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                mostrarErrorLogin(error);
                return;
            }

            // Esperar un momento para que se establezca la sesión
            await new Promise(resolve => setTimeout(resolve, 500));
            
            Swal.fire({
                title: "¡Bienvenido!",
                text: `Inicio de sesión exitoso para ${data.user.email}`,
                icon: "success",
                timer: 1500,
                showConfirmButton: false
            });

            setTimeout(() => {
                window.location.href = "principal.html";
            }, 1500);

        } catch (catchError) {
            console.error('Error inesperado:', catchError);
            Swal.fire({ 
                title: "Error inesperado", 
                text: "Ocurrió un error inesperado. Por favor intenta nuevamente.", 
                icon: "error" 
            });
        }
    });

    // ----------------- LOGIN CON GITHUB -----------------
    document.getElementById("githubLogin").addEventListener("click", async () => {
        try {
            // Usar la URL actual como base para el redirect
            const redirectUrl = `${window.location.origin}/principal.html`;
            
            console.log('Redirigiendo a GitHub...', redirectUrl);
            
            const { error } = await supabase.auth.signInWithOAuth({
                provider: "github",
                options: {
                    redirectTo: redirectUrl
                }
            });

            if (error) {
                console.error('Error con GitHub OAuth:', error);
                Swal.fire({
                    title: "Error con GitHub",
                    text: error.message,
                    icon: "error"
                });
            }
        } catch (error) {
            console.error('Error en login con GitHub:', error);
            Swal.fire({
                title: "Error",
                text: "No se pudo conectar con GitHub",
                icon: "error"
            });
        }
    });
    
    console.log('Index.html configurado correctamente');
});

// ======================
// INICIALIZACIÓN
// ======================


    </script>
</body>
</html>
