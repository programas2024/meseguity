<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Profesional</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box; }
    /* Navbar */
    .navbar { display:flex; justify-content:space-between; align-items:center; padding:1rem; background:#333; color:white; position:relative; }
    .navbar .logo { font-weight:bold; }
    .navbar ul { list-style:none; display:flex; gap:1rem; margin:0; padding:0; }
    .navbar a { color:white; text-decoration:none; }
    .menu-toggle { display:none; font-size:1.5rem; cursor:pointer; }

    /* Contenedor */
    .container { padding:2rem; max-width:1200px; margin:auto; }
    .btn { padding:0.5rem 1rem; border:none; cursor:pointer; margin:0.5rem; }
    .btn-primary { background:#007bff; color:white; }

    /* Footer */
    footer { background:#222; color:white; text-align:center; padding:1rem; margin-top:2rem; }

    /* Responsive */
    @media (max-width:768px) {
      .navbar ul { flex-direction: column; display:none; width:100%; background:#444; position:absolute; top:100%; left:0; }
      .navbar ul.active { display:flex; }
      .menu-toggle { display:block; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">MiLogo</div>
    <div class="menu-toggle" id="menu-toggle">☰</div>
    <ul id="menu">
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Servicios</a></li>
      <li><a href="#">Acerca</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </nav>

  <!-- Contenedor principal -->
  <div class="container">
    <section class="hero">
      <h1>Bienvenido a Mi Página Profesional</h1>
      <p>Plantilla lista para producción con menú hamburguesa responsive.</p>
      <button class="btn btn-primary">Comenzar</button>
      <button class="btn">Saber más</button>
    </section>

    <section class="features">
      <h2>Características</h2>
      <div class="feature-list">
        <div class="feature">Feature 1</div>
        <div class="feature">Feature 2</div>
        <div class="feature">Feature 3</div>
      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 Mi Página Profesional. Todos los derechos reservados.</p>
  </footer>

  <!-- JS para menú hamburguesa -->
  <script>
    const toggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('menu');
    toggle.addEventListener('click', () => {
      menu.classList.toggle('active');
    });
  </script>
</body>
</html>
